steps:

- name: 'gcr.io/kaniko-project/executor:latest'
  id: 'build-builder-base'
  args:
  - --destination=us-docker.pkg.dev/$PROJECT_ID/servod/servod-builder-base:latest-inline
  - --target=hdctools-builder-base
  - --cache=true
  - --cache-ttl=24h
  - --reproducible=true
  - -f=/workspace/dockerfiles/Dockerfile.base

- name: 'gcr.io/kaniko-project/executor:latest'
  id: 'build-base'
  args:
  - --destination=us-docker.pkg.dev/$PROJECT_ID/servod/servod-base:latest-inline
  - --target=base
  - --cache=true
  - --cache-ttl=24h
  - --reproducible=true
  - -f=/workspace/dockerfiles/Dockerfile.base
  waitFor: ['build-builder-base']

- name: 'gcr.io/kaniko-project/executor:latest'
  id: 'build'
  args:
  - --destination=us-docker.pkg.dev/$PROJECT_ID/servod/servod:latest
  - --destination=us-docker.pkg.dev/$PROJECT_ID/servod/servod:$_COMMIT_SHA
  - --cache=true
  - --cache-ttl=24h
  - --reproducible=true
  - --build-arg=BUILDER_BASE_IMG=us-docker.pkg.dev/$PROJECT_ID/servod/servod-builder-base:latest-inline
  - --build-arg=BASE_IMG=us-docker.pkg.dev/$PROJECT_ID/servod/servod-base:latest-inline
  - -f=/workspace/dockerfiles/Dockerfile
  waitFor: ['build-base']

options:
  env:
    - "DOCKER_BUILDKIT=1"
  # Use higher CPU machines so the caching and build steps are faster.
  pool:
    name: 'projects/chromeos-hw-tools-dev/locations/us-central1/workerPools/proto-servo-pool'

timeout: 3600s
