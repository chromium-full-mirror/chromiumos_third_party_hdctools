steps:

- name: 'gcr.io/kaniko-project/executor:latest'
  id: 'build'
  args:
  - --destination=us-docker.pkg.dev/$PROJECT_ID/servod/servod:latest
  - --cache=true
  - --cache-ttl=24h
  - -f=/workspace/servo/dockerfiles/Dockerfile

options:
  # Use higher CPU machines so the caching and build steps are faster.
  pool:
    name: 'projects/chromeos-hw-tools-dev/locations/us-central1/workerPools/proto-servo-pool'

timeout: 1800s
