

steps:
- name: 'gcr.io/kaniko-project/executor:latest'
  args:
  - --destination=us-docker.pkg.dev/$PROJECT_ID/servod/servod
  - --cache=true
  - --cache-ttl=96h
  - -f=/workspace/hdctools/servo/dockerfiles/Dockerfile

options:
  # Use higher CPU machines so the caching and build steps are faster.
  machineType: 'N1_HIGHCPU_32'

timeout: 780s